<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rex의 구구단 동물원 🐾</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
@font-face {
  font-family: 'Galmuri11';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2206-02@1.0/Galmuri11.woff2') format('woff2'),
       url('https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/Galmuri11.woff2') format('woff2');
  font-display: swap;
}
@font-face {
  font-family: 'DungGeunMo';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2107@1.1/DungGeunMo.woff') format('woff');
  font-display: swap;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --mc-slot: #8b8b8b;
  --mc-slot-light: #c6c6c6;
  --mc-slot-dark: #373737;
  --mc-slot-darker: #1a1a1a;
  --mc-text: #f4f4f4;
  --mc-text-dark: #3f3f3f;
  --mc-text-shadow: #3f3f3f;
  --mc-gold: #fcfc54;
  --mc-grass: #5d8e3a;
  --mc-grass-light: #7cb342;
  --mc-sky: #88c0f7;
  --mc-emerald: #17a85d;
  --mc-diamond: #5dd9e1;
  --mc-redstone: #d32f2f;
  --mc-xp: #80ff20;
}

html, body {
  height: 100%;
  font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  -webkit-font-smoothing: antialiased;
}
body {
  /* sky + simple cloud bands + grass + dirt horizon */
  background:
    /* clouds */
    radial-gradient(ellipse 90px 22px at 14% 18%, rgba(255,255,255,0.85) 50%, transparent 52%),
    radial-gradient(ellipse 70px 18px at 82% 10%, rgba(255,255,255,0.8) 50%, transparent 52%),
    radial-gradient(ellipse 50px 14px at 48% 24%, rgba(255,255,255,0.7) 50%, transparent 52%),
    linear-gradient(
      180deg,
      #88c0f7 0%,
      #a3d4ff 50%,
      #a3d4ff 55%,
      #7cb342 55%,
      #5d8e3a 60%,
      #7c5e3a 65%,
      #5a4528 100%
    );
  background-attachment: fixed;
  min-height: 100vh;
  color: #2c1810;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.pixel { font-family: 'Galmuri11', 'DungGeunMo', monospace; -webkit-font-smoothing: none; image-rendering: pixelated; letter-spacing: 0.5px; }
#app {
  max-width: 720px;
  margin: 0 auto;
  padding: 14px 12px 60px;
  min-height: 100vh;
}

/* === Minecraft inventory style === */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  padding: 8px 12px;
  background: var(--mc-slot-light);
  color: var(--mc-text-dark);
  border: 2px solid var(--mc-slot-darker);
  box-shadow:
    inset 2px 2px 0 #fefefe,
    inset -2px -2px 0 var(--mc-slot);
}
.header .title {
  font-family: 'Galmuri11', monospace;
  font-size: 1rem;
  cursor: pointer;
  color: #2c1810;
}
.header .stars {
  font-family: 'Galmuri11', monospace;
  font-size: 0.95rem;
  background: #2c1810;
  color: var(--mc-gold);
  padding: 4px 10px;
  border: 2px solid #1a0e08;
  text-shadow: 2px 2px 0 #5a4528;
}

/* Minecraft button: stone-gray with subtle bevel */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 18px;
  border: 2px solid var(--mc-slot-darker);
  background: linear-gradient(180deg, #a0a0a0 0%, #6b6b6b 100%);
  color: var(--mc-text);
  font-family: 'Galmuri11', monospace;
  font-size: 0.95rem;
  cursor: pointer;
  text-shadow: 2px 2px 0 var(--mc-text-shadow);
  box-shadow:
    inset 1px 1px 0 rgba(255,255,255,0.55),
    inset -1px -1px 0 rgba(0,0,0,0.35);
  transition: transform 0.05s, filter 0.1s;
  letter-spacing: 0.5px;
}
.btn:hover { filter: brightness(1.1); }
.btn:active {
  transform: translateY(2px);
  background: linear-gradient(180deg, #6b6b6b 0%, #a0a0a0 100%);
  box-shadow:
    inset 1px 1px 0 rgba(0,0,0,0.35),
    inset -1px -1px 0 rgba(255,255,255,0.55);
}
.btn.primary {
  background: linear-gradient(180deg, #5fa0e8 0%, #2c5a8a 100%);
}
.btn.primary:active { background: linear-gradient(180deg, #2c5a8a 0%, #5fa0e8 100%); }
.btn.success {
  background: linear-gradient(180deg, #7cb342 0%, #4a7d35 100%);
}
.btn.success:active { background: linear-gradient(180deg, #4a7d35 0%, #7cb342 100%); }
.btn.ghost {
  background: linear-gradient(180deg, #d8d8d8 0%, #a0a0a0 100%);
  color: var(--mc-text-dark);
  text-shadow: 1px 1px 0 rgba(255,255,255,0.6);
}
.btn.ghost:active { background: linear-gradient(180deg, #a0a0a0 0%, #d8d8d8 100%); }
.btn.big { font-size: 1.05rem; padding: 14px 22px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.menu-title {
  font-family: 'Galmuri11', monospace;
  text-align: center;
  font-size: 2rem;
  margin: 16px 0 6px;
  color: var(--mc-gold);
  text-shadow:
    3px 3px 0 var(--mc-text-shadow),
    -1px -1px 0 var(--mc-text-shadow),
    1px -1px 0 var(--mc-text-shadow),
    -1px 1px 0 var(--mc-text-shadow);
  letter-spacing: 3px;
  image-rendering: pixelated;
}
.menu-subtitle {
  text-align: center;
  font-size: 0.85rem;
  color: white;
  text-shadow: 1px 1px 0 #2c1810;
  margin-bottom: 16px;
  font-weight: 500;
}

.stage-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
.stage-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px;
  background: var(--mc-slot-light);
  border: 2px solid var(--mc-slot-darker);
  cursor: pointer;
  box-shadow:
    inset 2px 2px 0 #fefefe,
    inset -2px -2px 0 var(--mc-slot);
  transition: filter 0.1s, transform 0.05s;
  color: var(--mc-text-dark);
}
.stage-card:hover { filter: brightness(1.05); }
.stage-card:active { transform: translateY(1px); }
.stage-icon {
  width: 48px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.7rem;
  background: var(--mc-slot-dark);
  border: 2px solid var(--mc-slot-darker);
  box-shadow:
    inset 1px 1px 0 rgba(0,0,0,0.5),
    inset -1px -1px 0 rgba(255,255,255,0.05);
  flex-shrink: 0;
}
.stage-info { flex: 1; min-width: 0; }
.stage-name {
  font-family: 'Galmuri11', monospace;
  font-size: 0.95rem;
  color: var(--mc-text-dark);
}
.stage-desc {
  font-size: 0.82rem;
  color: #5a5a5a;
  margin-top: 2px;
  font-weight: 500;
}

.card {
  background: rgba(198, 198, 198, 0.95);
  border: 2px solid var(--mc-slot-darker);
  padding: 14px;
  margin-bottom: 14px;
  box-shadow:
    inset 2px 2px 0 #fefefe,
    inset -2px -2px 0 var(--mc-slot);
}

.groups-container {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  padding: 14px;
  min-height: 180px;
  align-items: center;
}
.group {
  display: grid;
  gap: 4px;
  padding: 8px;
  background: var(--mc-slot-light);
  border: 2px solid var(--mc-slot-darker);
  box-shadow: inset 2px 2px 0 #fefefe, inset -2px -2px 0 var(--mc-slot);
}
.group.counted {
  background: linear-gradient(180deg, #a8e070 0%, #5d8e3a 100%);
  animation: pop 0.3s steps(4);
}
.item-emoji {
  font-size: 1.7rem;
  text-align: center;
  line-height: 1;
}
.group-label {
  font-family: 'Galmuri11', monospace;
  font-size: 1rem;
  text-align: center;
  margin-top: 4px;
  color: #2c1810;
}

.array-wrap {
  display: flex;
  justify-content: center;
  margin: 14px 0;
}
.array-container {
  display: grid;
  gap: 4px;
  padding: 12px;
  background: var(--mc-slot-dark);
  border: 2px solid var(--mc-slot-darker);
  box-shadow: inset 1px 1px 0 rgba(0,0,0,0.5), inset -1px -1px 0 rgba(255,255,255,0.05);
  transition: transform 0.6s steps(8);
}
.array-container.rotating { transform: rotate(90deg); }
.dot {
  width: 22px; height: 22px;
  background: linear-gradient(135deg, #ff8a65 0%, #c63d16 100%);
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.4), inset -1px -1px 0 rgba(0,0,0,0.3);
}

.track {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px;
  background: var(--mc-slot-dark);
  border: 2px solid var(--mc-slot-darker);
  overflow-x: auto;
  margin-bottom: 14px;
  box-shadow: inset 1px 1px 0 rgba(0,0,0,0.5);
}
.track-step {
  min-width: 46px;
  height: 46px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Galmuri11', monospace;
  font-size: 1rem;
  background: var(--mc-slot-light);
  color: var(--mc-text-dark);
  border: 2px solid var(--mc-slot-darker);
  box-shadow: inset 1px 1px 0 #fefefe, inset -1px -1px 0 var(--mc-slot);
  flex-shrink: 0;
}
.track-step.done {
  background: linear-gradient(180deg, #7cb342 0%, #4a7d35 100%);
  color: white;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
}
.track-step.current {
  background: linear-gradient(180deg, #ffd54f 0%, #f5a623 100%);
  color: #2c1810;
  animation: bobble 0.7s steps(4) infinite alternate;
}
@keyframes bobble {
  from { transform: translateY(0); }
  to { transform: translateY(-5px); }
}
@keyframes pop {
  0% { transform: scale(0.5); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.question-box { text-align: center; padding: 18px 10px; }
.question-text {
  font-family: 'Galmuri11', monospace;
  font-size: 2.2rem;
  letter-spacing: 4px;
  color: #2c1810;
  margin: 6px 0;
  text-shadow: 3px 3px 0 var(--mc-gold);
  image-rendering: pixelated;
}
.choices {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 12px 0;
}
.choice-btn {
  padding: 18px 4px;
  font-family: 'Galmuri11', monospace;
  font-size: 1.5rem;
  border: 2px solid var(--mc-slot-darker);
  background: linear-gradient(180deg, #d8d8d8 0%, #a0a0a0 100%);
  color: var(--mc-text-dark);
  cursor: pointer;
  box-shadow:
    inset 1px 1px 0 #fefefe,
    inset -1px -1px 0 var(--mc-slot);
  letter-spacing: 1px;
  transition: transform 0.05s, filter 0.1s;
  text-shadow: 1px 1px 0 rgba(255,255,255,0.6);
}
.choice-btn:hover { filter: brightness(1.08); }
.choice-btn:active {
  transform: translateY(2px);
  background: linear-gradient(180deg, #a0a0a0 0%, #d8d8d8 100%);
}
.choice-btn.correct {
  background: linear-gradient(180deg, #a8e070 0%, #4a7d35 100%);
  color: white;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
}
.choice-btn.wrong {
  background: linear-gradient(180deg, #ef5350 0%, #8a1c1c 100%);
  color: white;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
}
.choice-btn:disabled { cursor: not-allowed; }

.hint {
  text-align: center;
  padding: 10px 14px;
  background: rgba(44, 24, 16, 0.85);
  color: var(--mc-text);
  border: 2px solid #1a0e08;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.1);
  font-size: 0.9rem;
  margin: 8px 0;
  font-weight: 500;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
}

.collection-section { margin-bottom: 14px; }
.section-title {
  font-family: 'Galmuri11', monospace;
  font-size: 1.05rem;
  margin-bottom: 8px;
  color: white;
  text-shadow: 2px 2px 0 #2c1810;
  image-rendering: pixelated;
}
.collection-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
@media (max-width: 480px) {
  .collection-grid { grid-template-columns: repeat(3, 1fr); }
  .choices { grid-template-columns: repeat(3, 1fr); }
}
.animal-card {
  background: var(--mc-slot-light);
  border: 2px solid var(--mc-slot-darker);
  padding: 10px 4px;
  text-align: center;
  box-shadow: inset 2px 2px 0 #fefefe, inset -2px -2px 0 var(--mc-slot);
  position: relative;
  color: var(--mc-text-dark);
}
.animal-card.locked {
  background: var(--mc-slot);
  box-shadow: inset 2px 2px 0 #a8a8a8, inset -2px -2px 0 #5a5a5a;
  color: #444;
}
.animal-card.tier-common {}
.animal-card.tier-rare {
  background: linear-gradient(180deg, #7eb0e8 0%, #2c5a8a 100%);
  color: white;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
}
.animal-card.tier-epic {
  background: linear-gradient(180deg, #c069d0 0%, #5d1264 100%);
  color: white;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
}
.animal-card.tier-legendary {
  background: linear-gradient(180deg, #ffe082 0%, #f5a623 100%);
  text-shadow: 1px 1px 0 rgba(255,255,255,0.4);
}
.animal-emoji {
  font-size: 2.2rem;
  line-height: 1;
  filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.4));
}
.animal-emoji.locked { filter: grayscale(1); opacity: 0.3; }
.animal-name {
  font-family: 'Galmuri11', monospace;
  font-size: 0.78rem;
  margin-top: 4px;
}
.animal-tag { font-size: 0.7rem; margin-top: 2px; opacity: 0.85; }
.tier-stars {
  position: absolute; top: 4px; right: 6px;
  font-size: 0.7rem;
  color: var(--mc-gold);
  text-shadow: 1px 1px 0 #2c1810;
}

.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  padding: 20px;
}
.modal {
  background: var(--mc-slot-light);
  border: 2px solid var(--mc-slot-darker);
  padding: 24px 18px;
  max-width: 360px;
  width: 100%;
  text-align: center;
  box-shadow:
    inset 2px 2px 0 #fefefe,
    inset -2px -2px 0 var(--mc-slot),
    0 6px 0 #1a1a1a;
  animation: modalPop 0.25s steps(4);
}
@keyframes modalPop {
  0% { transform: scale(0.3); }
  100% { transform: scale(1); }
}
.modal h2 {
  font-family: 'Galmuri11', monospace;
  font-size: 1.3rem;
  margin-bottom: 8px;
  color: #2c1810;
  text-shadow: 2px 2px 0 var(--mc-gold);
  letter-spacing: 1px;
  image-rendering: pixelated;
}
.modal p { font-size: 0.9rem; color: #444; margin: 6px 0; font-weight: 500; }
.modal .reward-emoji {
  font-size: 5rem;
  margin: 10px 0;
  animation: pxBounce 0.5s steps(2) infinite alternate;
  filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.4));
}
@keyframes pxBounce {
  from { transform: translateY(0); }
  to { transform: translateY(-12px); }
}

.feedback-popup {
  position: fixed;
  top: 30%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 5rem;
  pointer-events: none;
  z-index: 50;
  animation: feedbackAnim 0.9s steps(10) forwards;
  filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.4));
}
@keyframes feedbackAnim {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
  20% { opacity: 1; transform: translate(-50%, -50%) scale(1.4); }
  100% { opacity: 0; transform: translate(-50%, -100%) scale(1); }
}

.table-picker {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 12px 0;
}
.table-btn {
  padding: 14px 0;
  font-family: 'Galmuri11', monospace;
  font-size: 1.1rem;
  border: 2px solid var(--mc-slot-darker);
  background: linear-gradient(180deg, #d8d8d8 0%, #a0a0a0 100%);
  cursor: pointer;
  position: relative;
  color: var(--mc-text-dark);
  box-shadow:
    inset 1px 1px 0 #fefefe,
    inset -1px -1px 0 var(--mc-slot);
  text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
  transition: transform 0.05s, filter 0.1s;
}
.table-btn:hover { filter: brightness(1.08); }
.table-btn:active { transform: translateY(1px); }
.table-btn.done {
  background: linear-gradient(180deg, #a8e070 0%, #4a7d35 100%);
  color: white;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
}
.table-btn.done::after {
  content: '✓';
  position: absolute; top: 2px; right: 6px;
  font-size: 0.9rem;
}

.gacha-area { text-align: center; padding: 16px; }
.gacha-box {
  font-size: 5.5rem;
  margin: 14px 0;
  display: inline-block;
  filter: drop-shadow(4px 4px 0 rgba(0,0,0,0.4));
}
.gacha-box.shaking { animation: pxShake 0.25s steps(2) infinite; }
@keyframes pxShake {
  0%, 100% { transform: translateX(-4px); }
  50% { transform: translateX(4px); }
}

.row { display: flex; gap: 8px; align-items: center; }
.center { text-align: center; }
.mt-1 { margin-top: 8px; } .mt-2 { margin-top: 14px; } .mt-3 { margin-top: 22px; }
.mb-1 { margin-bottom: 8px; } .mb-2 { margin-bottom: 14px; }
.muted { color: #6b5240; }
.small { font-size: 0.8rem; }

.progress-bar {
  height: 14px;
  background: var(--mc-slot-dark);
  border: 2px solid var(--mc-slot-darker);
  overflow: hidden;
  margin: 8px 0;
  box-shadow: inset 1px 1px 0 rgba(0,0,0,0.5);
}
.progress-fill {
  height: 100%;
  background: linear-gradient(180deg, var(--mc-xp) 0%, #4a7d35 100%);
  transition: width 0.3s steps(10);
}

.back-btn {
  background: linear-gradient(180deg, #d8d8d8 0%, #a0a0a0 100%);
  border: 2px solid var(--mc-slot-darker);
  padding: 6px 12px;
  font-family: 'Galmuri11', monospace;
  font-size: 0.85rem;
  cursor: pointer;
  color: var(--mc-text-dark);
  margin-right: 8px;
  text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
  box-shadow: inset 1px 1px 0 #fefefe, inset -1px -1px 0 var(--mc-slot);
}
.back-btn:hover { filter: brightness(1.08); }

.streak-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  background: linear-gradient(180deg, #ef5350 0%, #8a1c1c 100%);
  color: white;
  border: 2px solid #1a0e08;
  font-family: 'Galmuri11', monospace;
  font-size: 0.95rem;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
}

.formula-display {
  font-family: 'Galmuri11', monospace;
  font-size: 1.6rem;
  text-align: center;
  padding: 12px;
  color: #2c1810;
  letter-spacing: 2px;
  text-shadow: 2px 2px 0 var(--mc-gold);
  image-rendering: pixelated;
}
.formula-display .equals { color: var(--mc-redstone); margin: 0 6px; }

.gugu-table-card {
  background: var(--mc-slot-light);
  padding: 14px 12px;
  margin-bottom: 14px;
  border: 2px solid var(--mc-slot-darker);
  box-shadow:
    inset 2px 2px 0 #fefefe,
    inset -2px -2px 0 var(--mc-slot);
}
.gugu-title {
  font-family: 'Galmuri11', monospace;
  text-align: center;
  font-size: 2rem;
  margin-bottom: 4px;
  letter-spacing: 4px;
  text-shadow: 3px 3px 0 rgba(0,0,0,0.25);
  image-rendering: pixelated;
}
.gugu-subhint {
  text-align: center;
  font-size: 0.85rem;
  color: #555;
  margin-bottom: 12px;
  font-weight: 500;
}
.gugu-rows { display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; }
.gugu-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px 12px;
  background: rgba(255,255,255,0.7);
  border: 2px solid var(--mc-slot-darker);
  border-left-width: 8px;
  border-left-color: var(--table-color, #4d8edb);
  opacity: 0;
  transform: translateX(-20px);
}
.gugu-row.shown {
  animation: rowSlideIn 0.4s steps(6) forwards;
}
@keyframes rowSlideIn {
  to { opacity: 1; transform: translateX(0); }
}
.gugu-groups {
  display: flex; flex-wrap: wrap; gap: 5px;
  justify-content: flex-start;
}
.gugu-group {
  display: inline-flex; gap: 3px;
  padding: 4px 6px;
  background: var(--table-color-light, rgba(0,0,0,0.05));
  border: 1px solid var(--mc-slot-darker);
  align-items: center;
}

  }
  return audioCtx;
}
function tone(freq, duration = 0.15, type = 'sine', volume = 0.18) {
  const ctx = getAudio(); if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch (e) {}
}

function h(tag, props, ...children) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.setAttribute('style', v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'html') el.innerHTML = v;
      else el.setAttribute(k, v);
    }
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.appendChild(typeof c === 'string' || typeof c === 'number'
      ? document.createTextNode(c) : c);
  }
  return el;
}
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) { return arr.slice().sort(() => Math.random() - 0.5); }

function generateChoices(correct) {
  const set = new Set([correct]);
  let tries = 0;
  while (set.size < 3 && tries < 50) {
    tries++;
    const delta = (randInt(1, 5)) * (Math.random() < 0.5 ? 1 : -1);
    const c = correct + delta;
    if (c > 0 && c <= 99) set.add(c);
  }
  while (set.size < 3) set.add(randInt(1, 81));
  return shuffle(Array.from(set));
}

// ============ STAGE 0: 구구단 노래 (단별 순회) ============
const TABLE_COLORS = {
  2: { main: '#ef5350', light: 'rgba(239,83,80,0.12)' },
  3: { main: '#ff7043', light: 'rgba(255,112,67,0.12)' },
  4: { main: '#ffb300', light: 'rgba(255,179,0,0.15)' },
  5: { main: '#66bb6a', light: 'rgba(102,187,106,0.13)' },
  6: { main: '#29b6f6', light: 'rgba(41,182,246,0.12)' },
  7: { main: '#5c6bc0', light: 'rgba(92,107,192,0.12)' },
  8: { main: '#ab47bc', light: 'rgba(171,71,188,0.12)' },
  9: { main: '#ec407a', light: 'rgba(236,64,122,0.12)' },
};
const STAGE0_NOTES = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99];

function renderStage0() {
  const currentTable = params.table || 2;
  const color = TABLE_COLORS[currentTable];
  let revealedCount = 0;
  let seenAwarded = false;

  app.appendChild(backHeader(`준비 · ${currentTable}단`));

  // progress dots
  const dotsWrap = h('div', { class: 'progress-dots' });
  TABLES.forEach(t => {
    const cls = 'progress-dot' +
      (t === currentTable ? ' current' : '') +
      (state.stage0Seen[t] ? ' done' : '');
    dotsWrap.appendChild(h('div', { class: cls }, `${t}`));
  });
  app.appendChild(dotsWrap);

  const card = h('div', {
    class: 'gugu-table-card',
    style: `--table-color: ${color.main}; --table-color-light: ${color.light}; border-top: 6px solid ${color.main};`,
  });
  card.appendChild(h('div', { class: 'gugu-title', style: `color: ${color.main};` }, `${currentTable} 단`));
  const hintEl = h('div', { class: 'gugu-subhint' }, `👇 아래 버튼을 톡 누르면 한 줄씩 나와요!`);
  card.appendChild(hintEl);

  // create 9 row containers (rendered as placeholders initially)
  const rowsWrap = h('div', { class: 'gugu-rows' });
  const slotEls = [];
  for (let i = 1; i <= 9; i++) {
    const placeholder = h('div', { class: 'gugu-row-placeholder' }, `${currentTable} × ${i} = ?`);
    rowsWrap.appendChild(placeholder);
    slotEls.push({ container: rowsWrap, placeholder, i });
  }
  card.appendChild(rowsWrap);
  app.appendChild(card);

  // bottom button: reveals next row, then becomes "next stage"
  const mainBtn = h('button', { class: 'btn primary big' }, `👆 다음 줄 보기 (1 / 9)`);
  const prevBtn = h('button', {
    class: 'btn ghost',
    onClick: () => { if (currentTable > 2) navigate('stage0', { table: currentTable - 1 }); },
  }, '← 이전 단');
  if (currentTable === 2) prevBtn.disabled = true;
  const replayBtn = h('button', {
    class: 'btn ghost',
    onClick: () => navigate('stage0', { table: currentTable }),
  }, '🔁 다시');

  app.appendChild(h('div', { class: 'stage0-nav' }, prevBtn, replayBtn, mainBtn));

  function revealNextRow() {
    const i = revealedCount + 1;
    const product = currentTable * i;
    const slot = slotEls[revealedCount];

    // build the actual row
    const groupsContainer = h('div', { class: 'gugu-groups' });
    for (let g = 0; g < i; g++) {
      const group = h('div', { class: 'gugu-group' });
      for (let k = 0; k < currentTable; k++) {
        const dot = h('div', { class: 'gugu-dot' });
        const totalIdx = g * currentTable + k;
        const totalDots = i * currentTable;
        const perDotDelay = Math.min(45, 600 / totalDots);
        dot.style.animationDelay = `${totalIdx * perDotDelay + 200}ms`;
        group.appendChild(dot);
      }
      groupsContainer.appendChild(group);
    }
    const formula = h('div', { class: 'gugu-formula' },
      h('span', { class: 'lhs' }, `${currentTable} × ${i}`),
      h('span', { class: 'eq' }, '='),
      h('span', { class: 'rhs' }, String(product)),
    );
    const row = h('div', { class: 'gugu-row' }, groupsContainer, formula);
    slot.placeholder.replaceWith(row);
    requestAnimationFrame(() => {
      row.classList.add('shown');
      // keep the newly revealed row visible above the sticky button
      setTimeout(() => row.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
    });

    tone(STAGE0_NOTES[revealedCount], 0.22, 'sine', 0.13);
    revealedCount++;

    if (revealedCount < 9) {
      mainBtn.textContent = `👆 다음 줄 보기 (${revealedCount + 1} / 9)`;
    } else {
      // all revealed — switch to next stage button
      hintEl.textContent = '🎉 다 봤어! 다음 단으로 가볼까?';
      mainBtn.textContent = currentTable < 9 ? `${currentTable + 1}단으로 →` : '🎉 끝!';
      mainBtn.classList.remove('primary');
      mainBtn.classList.add('success');
      // re-bind to go-next
      mainBtn.onclick = goNext;
      // mark seen + reward
      if (!seenAwarded && !state.stage0Seen[currentTable]) {
        state.stage0Seen[currentTable] = true;
        awardStars(1);
        saveState();
        seenAwarded = true;
        const starsEl = app.querySelector('.stars');
        if (starsEl) starsEl.textContent = `⭐ ${state.stars}`;
        const dot = dotsWrap.children[currentTable - 2];
        if (dot) dot.classList.add('done');
      }
    }
  }

  function goNext() {
    if (currentTable < 9) navigate('stage0', { table: currentTable + 1 });
    else finishStage0();
  }

  mainBtn.onclick = revealNextRow;
}

function finishStage0() {
  sndReward();
  showModal({
    emoji: '🎵',
    title: '구구단 노래 완성!',
    body: h('div', null,
      h('p', null, '2단부터 9단까지 모두 들어봤어요!'),
      h('p', { class: 'muted' }, '이제 1단계로 가서 직접 풀어볼까?'),
    ),
    button: '메뉴로',
    onClose: () => navigate('menu'),
  });
}

// ============ STAGE 1: 묶음 보기 ============
function renderStage1() {
  const a = randInt(2, 5);
  const b = randInt(2, 5);
  const item = pick(STAGE1_ITEMS);
  const correct = a * b;
  const choices = generateChoices(correct);
  let answered = false;
  let countedGroups = 0;

  app.appendChild(backHeader('1단계 · 묶음 보기'));
  app.appendChild(h('div', { class: 'hint' },
    `${item}이(가) ${a}개씩 ${b}묶음! 다 합치면 몇 개일까?`));

  const groupsWrap = h('div', { class: 'card groups-container' });
  const groups = [];
  for (let i = 0; i < b; i++) {
    const grp = h('div', { class: 'group' });
    for (let j = 0; j < a; j++) {
      grp.appendChild(h('div', { class: 'item-emoji' }, item));
    }
    const label = h('div', { class: 'group-label' }, '');
    grp.appendChild(label);
    grp.addEventListener('click', () => countGroup(i));
    groups.push({ el: grp, label });
    groupsWrap.appendChild(grp);
  }
  app.appendChild(groupsWrap);

  app.appendChild(h('div', { class: 'small muted center', style: 'margin: -8px 0 12px;' },
    '💡 묶음을 하나씩 톡톡 눌러서 같이 세어볼까?'));

  function countGroup(i) {
    if (groups[i].el.classList.contains('counted')) return;
    groups[i].el.classList.add('counted');
    countedGroups++;
    const total = countedGroups * a;
    groups[i].label.textContent = total;
    tone(440 + countedGroups * 80, 0.12);
  }

  const choicesEl = h('div', { class: 'choices card' });
  choices.forEach(c => {
    const btn = h('button', { class: 'choice-btn' }, String(c));
    btn.addEventListener('click', () => {
      if (answered) return;
      answered = true;
      if (c === correct) {
        btn.classList.add('correct');
        sndCorrect(); feedback('correct');
        // auto-count remaining
        for (let i = 0; i < b; i++) if (!groups[i].el.classList.contains('counted')) {
          setTimeout(() => countGroup(i), (i + 1) * 100);
        }
        awardStars(1);
        setTimeout(() => {
          showModal({
            emoji: '🎉',
            title: '정답!',
            body: h('div', { class: 'formula-display' },
              `${a}`, h('span', { class: 'equals' }, '×'), `${b}`,
              h('span', { class: 'equals' }, '='), `${correct}`,
            ),
            button: '다음 문제',
            onClose: () => renderStage1AsView(),
          });
        }, 800);
      } else {
        btn.classList.add('wrong');
        sndWrong(); feedback('wrong');
        setTimeout(() => { btn.classList.remove('wrong'); answered = false; }, 600);
      }
    });
    choicesEl.appendChild(btn);
  });
  app.appendChild(choicesEl);
}
function renderStage1AsView() { app.innerHTML = ''; renderStage1(); }

    const isDone = state.tablesDone[stage] && state.tablesDone[stage][t];
    const hasGuardian = state.guardians[t];
    const btn = h('button', { class: 'table-btn' + (isDone ? ' done' : '') });
    btn.appendChild(h('div', null, `${t}단`));
    if (stage === 'stage4' && hasGuardian) {
      btn.appendChild(h('div', { style: 'font-size: 1.4rem; margin-top: 4px;' }, GUARDIAN_ANIMALS[t].emoji));
    }
    btn.addEventListener('click', () => {
      sndClick();
      navigate(stage, { table: t });
    });
    picker.appendChild(btn);
  });
  app.appendChild(picker);
}

// ============ STAGE 3: 묶어세기 ============
function renderStage3() {
  const t = params.table || 2;
  app.appendChild(backHeader(`3단계 · ${t}단 뛰어세기`));
  app.appendChild(h('div', { class: 'hint' },
    `${t}씩 뛰어 세어보자! 빈 칸에 들어갈 수는?`));

  // visible numbers: positions 0..8 (representing ×1..×9). Some shown, some blank.
  // Strategy: show some early ones, ask for the rest one by one
  const sequence = [];
  for (let i = 1; i <= 9; i++) sequence.push(t * i);

  // We'll progressively reveal. State: currentIdx points to which one is being asked.
  // First two are shown as hints; then ask 3rd, 4th... up to 9th.
  let currentIdx = 2; // first unknown is index 2 (×3)
  const filled = new Array(9).fill(false);
  filled[0] = true; filled[1] = true;

  const trackEl = h('div', { class: 'track' });
  const stepEls = [];
  for (let i = 0; i < 9; i++) {
    const el = h('div', { class: 'track-step' });
    el.textContent = filled[i] ? sequence[i] : '?';
    if (filled[i]) el.classList.add('done');
    trackEl.appendChild(el);
    stepEls.push(el);
  }
  app.appendChild(trackEl);

  const qbox = h('div', { class: 'card question-box' });
  app.appendChild(qbox);
  const choicesEl = h('div', { class: 'choices card' });
  app.appendChild(choicesEl);

  function updateUI() {
    if (currentIdx >= 9) {
      // done
      qbox.innerHTML = '';
      choicesEl.innerHTML = '';
      qbox.appendChild(h('div', { class: 'question-text', style: 'font-size: 1.4rem; color: #388e3c;' }, '🎉 9칸 모두 완성!'));
      finishStage3(t);
      return;
    }
    stepEls.forEach((el, i) => {
      el.classList.remove('current');
      if (i === currentIdx) el.classList.add('current');
    });

    qbox.innerHTML = '';
    qbox.appendChild(h('div', { class: 'question-text', style: 'font-size: 2rem;' },
      `${t} × ${currentIdx + 1} = ?`));

    const correct = sequence[currentIdx];
    const opts = generateChoices(correct);
    choicesEl.innerHTML = '';
    let answered = false;
    opts.forEach(c => {
      const btn = h('button', { class: 'choice-btn' }, String(c));
      btn.addEventListener('click', () => {
        if (answered) return;
        answered = true;
        if (c === correct) {
          btn.classList.add('correct');
          sndCorrect(); feedback('correct');
          stepEls[currentIdx].textContent = correct;
          stepEls[currentIdx].classList.add('done');
          stepEls[currentIdx].classList.remove('current');
          currentIdx++;
          setTimeout(updateUI, 700);
        } else {
          btn.classList.add('wrong');
          sndWrong(); feedback('wrong');
          setTimeout(() => { btn.classList.remove('wrong'); answered = false; }, 700);
        }
      });
      choicesEl.appendChild(btn);
    });
  }
  updateUI();
}

function finishStage3(t) {
  const isFirst = !state.tablesDone.s3[t];
  state.tablesDone.s3[t] = true;
  const reward = isFirst ? 8 : 3;
  awardStars(reward);
  sndReward();
  setTimeout(() => {
    showModal({
      emoji: '🏃‍♂️',
      title: `${t}단 뛰어세기 완성!`,
      body: h('div', null,
        h('p', null, `별 ${reward}개를 받았어요!`),
        h('p', { class: 'muted' }, isFirst ? '처음 완성이라 보너스!' : '계속 연습 좋아요!'),
      ),
      button: '돌아가기',
      onClose: () => navigate('tablePicker', { stage: 'stage3' }),
    });
  }, 600);
}

// ============ STAGE 4: 순서대로 퀴즈 ============
function renderStage4() {
  const t = params.table || 2;
  app.appendChild(backHeader(`4단계 · ${t}단 차근차근`));

  let idx = 1;
  let wrongs = 0;
  const total = 9;

  const progress = h('div', { class: 'progress-bar' },
    h('div', { class: 'progress-fill', style: 'width: 0%;' }));
  app.appendChild(progress);

  const qbox = h('div', { class: 'card question-box' });
  app.appendChild(qbox);
  const choicesEl = h('div', { class: 'choices card' });
  app.appendChild(choicesEl);

  function updateUI() {
    const fillPct = ((idx - 1) / total) * 100;
    progress.querySelector('.progress-fill').style.width = fillPct + '%';

    if (idx > total) {
      finishStage4(t, wrongs);
      return;
    }
    const correct = t * idx;
    const opts = generateChoices(correct);
    qbox.innerHTML = '';
    qbox.appendChild(h('div', { class: 'small muted' }, `${idx} / ${total}`));
    qbox.appendChild(h('div', { class: 'question-text' },
      `${t} × ${idx} = ?`));

    choicesEl.innerHTML = '';
    let answered = false;
    opts.forEach(c => {
      const btn = h('button', { class: 'choice-btn' }, String(c));
      btn.addEventListener('click', () => {
        if (answered) return;
        answered = true;
        if (c === correct) {
          btn.classList.add('correct');
          sndCorrect(); feedback('correct');
          awardStars(1);
          idx++;
          setTimeout(updateUI, 600);
        } else {
          btn.classList.add('wrong');
          sndWrong(); feedback('wrong');
          wrongs++;
          setTimeout(() => { btn.classList.remove('wrong'); answered = false; }, 700);
        }
      });
      choicesEl.appendChild(btn);
    });
  }
  updateUI();
}

function finishStage4(t, wrongs) {
  const wasFirst = !state.tablesDone.s4[t];
  state.tablesDone.s4[t] = true;
  const gotGuardian = awardGuardian(t);
  const bonus = (wrongs === 0 ? 10 : 5);
  awardStars(bonus);
  sndReward();

  setTimeout(() => {
    if (gotGuardian) {
      const g = GUARDIAN_ANIMALS[t];
      showModal({
        emoji: g.emoji,
        title: `${t}단의 수호 동물!`,
        body: h('div', null,
          h('p', null, `${g.name}이(가) 도감에 추가됐어요!`),
          h('p', { class: 'muted' }, `+ 별 ${bonus}개${wrongs === 0 ? ' (실수 없이 완성!)' : ''}`),
        ),
        button: '도감 보기',
        onClose: () => navigate('collection'),
      });
    } else {
      showModal({
        emoji: '⭐',
        title: `${t}단 완성!`,
        body: `별 ${bonus}개${wrongs === 0 ? ' (실수 없음!)' : ''}`,
        button: '돌아가기',
        onClose: () => navigate('tablePicker', { stage: 'stage4' }),
      });
    }
  }, 600);
}

// ============ STAGE 5: 랜덤 ============
function renderStage5() {
  app.appendChild(backHeader('5단계 · 랜덤 도전'));
  app.appendChild(h('div', { class: 'hint' },
    `🔥 연속 정답: ${state.streak} · 최고: ${state.bestStreak}`));

  const qbox = h('div', { class: 'card question-box' });
  app.appendChild(qbox);
  const choicesEl = h('div', { class: 'choices card' });
  app.appendChild(choicesEl);

  app.appendChild(h('div', { class: 'row mt-2', style: 'justify-content: center;' },
    h('button', { class: 'btn ghost', onClick: () => navigate('menu') }, '그만하기'),
  ));

  function pickProblem() {
    // Leitner-ish: weight problems by (wrong*3 + max(0, 3-correct) + 1)
    const candidates = [];
    for (const a of TABLES) {
      for (let b = 1; b <= 9; b++) {
        const key = `${a}x${b}`;
        const s = state.sessionProblems[key] || { correct: 0, wrong: 0 };
        const weight = s.wrong * 3 + Math.max(0, 3 - s.correct) + 1;
        candidates.push({ a, b, key, weight });
      }
    }
    const total = candidates.reduce((s, c) => s + c.weight, 0);
    let r = Math.random() * total;
    for (const c of candidates) {
      if (r < c.weight) return c;
      r -= c.weight;
    }
    return candidates[0];
  }

  function nextQ() {
    const { a, b, key } = pickProblem();
    const correct = a * b;
    const opts = generateChoices(correct);
    qbox.innerHTML = '';
    qbox.appendChild(h('div', { class: 'row', style: 'justify-content: center; margin-bottom: 8px;' },
      h('div', { class: 'streak-badge' }, `🔥 ${state.streak}`)));
    qbox.appendChild(h('div', { class: 'question-text' },
      `${a} × ${b} = ?`));

    choicesEl.innerHTML = '';
    let answered = false;
    opts.forEach(c => {
      const btn = h('button', { class: 'choice-btn' }, String(c));
      btn.addEventListener('click', () => {
        if (answered) return;
        answered = true;
        if (!state.sessionProblems[key]) state.sessionProblems[key] = { correct: 0, wrong: 0 };
        if (c === correct) {
          btn.classList.add('correct');
          sndCorrect(); feedback('correct');
          state.sessionProblems[key].correct++;
          state.streak++;
          if (state.streak > state.bestStreak) state.bestStreak = state.streak;
          let stars = 1;
          if (state.streak > 0 && state.streak % 5 === 0) {
            stars += 5;
            setTimeout(() => sndReward(), 300);
          }
          awardStars(stars);
          saveState();
          // refresh streak display
          const hint = app.querySelector('.hint');
          if (hint) hint.textContent = `🔥 연속 정답: ${state.streak} · 최고: ${state.bestStreak}`;
          // update stars in header
          const starsEl = app.querySelector('.stars');
          if (starsEl) starsEl.textContent = `⭐ ${state.stars}`;
          if (state.streak > 0 && state.streak % 5 === 0) {
            setTimeout(() => {
              showModal({
                emoji: '🔥',
                title: `${state.streak}연속!`,
                body: '+ 별 5개 보너스!',
                button: '계속!',
                onClose: nextQ,
              });
            }, 700);
          } else {
            setTimeout(nextQ, 700);
          }
        } else {
          btn.classList.add('wrong');
          sndWrong(); feedback('wrong');
          state.sessionProblems[key].wrong++;
          state.streak = 0;
          saveState();
          const hint = app.querySelector('.hint');
          if (hint) hint.textContent = `🔥 연속 정답: ${state.streak} · 최고: ${state.bestStreak}`;
          // show correct
          Array.from(choicesEl.children).forEach(child => {
            if (child.textContent === String(correct)) child.classList.add('correct');
          });
          setTimeout(() => {
            showModal({
              emoji: '💭',
              title: `${a} × ${b} = ${correct}`,
              body: '괜찮아! 다음에 또 만나면 풀 수 있어 💪',
              button: '계속하기',
              onClose: nextQ,
            });
          }, 800);
        }
      });
      choicesEl.appendChild(btn);
    });
  }
  nextQ();
}

// ============ COLLECTION ============
function renderCollection() {
  app.appendChild(backHeader('📖 동물 도감'));

  const guardiansSec = h('div', { class: 'collection-section card' });
  guardiansSec.appendChild(h('div', { class: 'section-title' },
    `🛡️ 수호 동물 (${Object.keys(state.guardians).length} / 8)`));
  const gGrid = h('div', { class: 'collection-grid' });
  TABLES.forEach(t => {
    const g = GUARDIAN_ANIMALS[t];
    const got = state.guardians[t];
    gGrid.appendChild(h('div', { class: 'animal-card' + (got ? '' : ' locked') },
      h('div', { class: 'animal-emoji' + (got ? '' : ' locked') }, got ? g.emoji : '❓'),
      h('div', { class: 'animal-name' }, got ? g.name : '???'),
      h('div', { class: 'animal-tag' }, `${t}단`),
    ));
  });
  guardiansSec.appendChild(gGrid);
  app.appendChild(guardiansSec);

  const bonusSec = h('div', { class: 'collection-section card' });
  bonusSec.appendChild(h('div', { class: 'section-title' },
    `🎁 친구 동물 (${Object.keys(state.bonusAnimals).length} / ${BONUS_ANIMALS.length})`));
  const bGrid = h('div', { class: 'collection-grid' });
  BONUS_ANIMALS.forEach(a => {
    const got = state.bonusAnimals[a.emoji];
    bGrid.appendChild(h('div', { class: `animal-card tier-${a.tier}` + (got ? '' : ' locked') },
      h('div', { class: 'tier-stars' }, TIER_INFO[a.tier].stars),
      h('div', { class: 'animal-emoji' + (got ? '' : ' locked') }, got ? a.emoji : '❓'),
      h('div', { class: 'animal-name' }, got ? a.name : '???'),
      h('div', { class: 'animal-tag' }, TIER_INFO[a.tier].label),
    ));
  });
  bonusSec.appendChild(bGrid);
  app.appendChild(bonusSec);
}

// ============ GACHA ============
function renderGacha() {
  app.appendChild(backHeader('🎁 동물 뽑기'));
  const wrap = h('div', { class: 'card gacha-area' });

  wrap.appendChild(h('div', { class: 'small muted' }, `별 ${GACHA_COST}개로 친구 동물을 뽑을 수 있어요!`));

  const box = h('div', { class: 'gacha-box' }, '🎁');
  wrap.appendChild(box);
  wrap.appendChild(h('div', { class: 'small muted mb-2' },
    `보유: ⭐ ${state.stars}`));

  // probability hint
  const probs = h('div', { class: 'small muted', style: 'margin: 10px 0; line-height: 1.6;' },
    h('div', null, `★ 평범 60%  /  ★★ 귀한 25%`),
    h('div', null, `★★★ 특별 12%  /  ★★★★ 전설 3%`),
  );
  wrap.appendChild(probs);

  const canAfford = state.stars >= GACHA_COST;
  const btn = h('button', {
    class: 'btn big primary',
    onClick: doGacha,
  }, `🎁 뽑기 (⭐ ${GACHA_COST})`);
  if (!canAfford) btn.disabled = true;
  wrap.appendChild(btn);

  app.appendChild(wrap);

  function doGacha() {
    if (state.stars < GACHA_COST) return;
    state.stars -= GACHA_COST;
    saveState();
    btn.disabled = true;
    box.classList.add('shaking');
    sndClick();
    setTimeout(() => {
      const animal = pickGachaAnimal();
      const wasNew = !state.bonusAnimals[animal.emoji];
      state.bonusAnimals[animal.emoji] = true;
      saveState();
      box.classList.remove('shaking');
      box.textContent = animal.emoji;
      sndReward();
      setTimeout(() => {
        showModal({
          emoji: animal.emoji,
          title: `${animal.name}!`,
          body: h('div', null,
            h('div', { style: `font-weight: 800; color: ${
              animal.tier === 'legendary' ? '#ef6c00' :
              animal.tier === 'epic' ? '#8e24aa' :
              animal.tier === 'rare' ? '#1976d2' : '#607d8b'
            }; margin-bottom: 6px;` },
              `${TIER_INFO[animal.tier].stars} ${TIER_INFO[animal.tier].label} 동물`),
            h('p', { class: 'muted' }, wasNew ? '✨ 새 친구!' : '이미 만난 친구지만 반가워요!'),
          ),
          button: '한번 더!',
          onClose: () => navigate('gacha'),
        });
      }, 500);
    }, 1200);
  }
}

// ============ INIT ============
render();
</script>
